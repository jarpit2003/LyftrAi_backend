version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: sqlite:////data/app.db
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    volumes:
      - ./data:/data
    restart: unless-stopped
